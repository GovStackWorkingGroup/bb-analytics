openapi: 3.1.0
info:
  title: GovStack Analytics Building Block – Core API
  version: 0.1.0-draft
  summary: Indicator service with traceable provenance
  description: |
    Draft of the core interface of the Analytics Building Block, derived from the
    specification draft and the interface walkthrough (as of 30 October 2026).

    Requirement levels: every operation carries `x-govstack-requirement` with `MUST`
    (mandatory in the core) or `SHOULD` (recommended).

    Basics: HTTP per RFC 9110 over TLS; every request carries a bearer token per
    RFC 6750, issued via the Identity Building Block. Read permissions are governed
    by the platform's access management; the building block returns no data and
    sends no events the caller is not authorized for. Errors follow RFC 9457.

    Open points not yet covered by this file: dedicated access classes (open
    decision in the draft) and a plain CSV delivery without a Data Package
    (proposed, not decided).
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
servers:
  - url: https://analytics.example.gov
    description: Placeholder for an installation

security:
  - bearerAuth: []

tags:
  - name: Catalogue
    description: Datasets, schemas, versions and code lists
  - name: Ingestion
    description: Delivery and validation of dataset versions
  - name: Indicators
    description: Indicator definitions and calculations
  - name: Values
    description: Retrieval of indicator values
  - name: Provenance
    description: Provenance records
  - name: Export
    description: Export of dataset versions and asynchronous downloads
  - name: Events
    description: Subscriptions to CloudEvents

paths:

  /catalogue:
    get:
      tags: [Catalogue]
      operationId: getCatalogue
      summary: Get the full data catalogue
      x-govstack-requirement: MUST
      responses:
        '200':
          description: Catalogue with JSON-LD context (DCAT 3)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalogue' }
            application/ld+json:
              schema: { $ref: '#/components/schemas/Catalogue' }
        default: { $ref: '#/components/responses/Problem' }

  /datasets:
    post:
      tags: [Catalogue]
      operationId: createDataset
      summary: Create a dataset
      description: The building block sets the origin itself (ORIGINAL).
      x-govstack-requirement: MUST
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatasetCreate' }
      responses:
        '201':
          description: Dataset created
          headers:
            Location: { $ref: '#/components/headers/Location' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /datasets/{dataset_id}:
    parameters:
      - $ref: '#/components/parameters/DatasetId'
    get:
      tags: [Catalogue]
      operationId: getDataset
      summary: Get the catalogue entry of a dataset
      x-govstack-requirement: MUST
      responses:
        '200':
          description: Catalogue entry with JSON-LD context (DCAT 3)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetEntry' }
            application/ld+json:
              schema: { $ref: '#/components/schemas/DatasetEntry' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /datasets/{dataset_id}/schema:
    parameters:
      - $ref: '#/components/parameters/DatasetId'
    get:
      tags: [Catalogue]
      operationId: getCurrentSchema
      summary: Get the current Table Schema
      x-govstack-requirement: MUST
      responses:
        '200':
          description: Table Schema per Data Package Standard 2.0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TableSchema' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [Catalogue]
      operationId: putSchema
      summary: Set the Table Schema (creates a new schema version)
      description: |
        Field roles: an explicit `role` property takes precedence. Otherwise primary
        key fields are identifiers, a primary key field with a temporal type is the
        time, and all other fields are measures. If the time is ambiguous, the
        schema is rejected.
      x-govstack-requirement: MUST
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TableSchema' }
      responses:
        '204':
          description: Schema accepted
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /datasets/{dataset_id}/schema/{schema_version}:
    parameters:
      - $ref: '#/components/parameters/DatasetId'
      - name: schema_version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Catalogue]
      operationId: getSchemaVersion
      summary: Get a specific schema version
      x-govstack-requirement: MUST
      responses:
        '200':
          description: Table Schema
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TableSchema' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /datasets/{dataset_id}/versions:
    parameters:
      - $ref: '#/components/parameters/DatasetId'
    post:
      tags: [Ingestion]
      operationId: deliverDatasetVersion
      summary: Deliver a dataset version
      description: |
        Delivery as a Data Package per Data Package Standard 2.0 in a multipart
        request (RFC 7578): one part `datapackage.json`, plus one part per resource
        named after its `path`. Text formats in UTF-8. Validation runs
        asynchronously; the result is available from the receipt or via the
        `delivery.checked` event.
      x-govstack-requirement: MUST
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [datapackage.json]
              properties:
                datapackage.json:
                  $ref: '#/components/schemas/DataPackage'
              additionalProperties:
                type: string
                contentMediaType: text/csv
            encoding:
              datapackage.json:
                contentType: application/json
      responses:
        '202':
          description: Delivery accepted, validation in progress
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '409':
          description: Idempotency-Key already used with different content
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      tags: [Catalogue]
      operationId: listDatasetVersions
      summary: List all versions of a dataset
      description: Includes withdrawn versions and versions whose content has been deleted.
      x-govstack-requirement: MUST
      responses:
        '200':
          description: Versions with JSON-LD context (DCAT 3)
          content:
            application/json:
              schema:
                type: object
                properties:
                  '@context': { $ref: '#/components/schemas/JsonLdContext' }
                  versions:
                    type: array
                    items: { $ref: '#/components/schemas/DatasetVersion' }
        default: { $ref: '#/components/responses/Problem' }

  /datasets/{dataset_id}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/DatasetId'
      - $ref: '#/components/parameters/Version'
    get:
      tags: [Catalogue]
      operationId: getDatasetVersion
      summary: Get the metadata of a dataset version
      x-govstack-requirement: MUST
      responses:
        '200':
          description: Version metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetVersion' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Ingestion]
      operationId: withdrawDatasetVersion
      summary: Withdraw a dataset version
      description: |
        Deletes the content; the metadata remain with status `withdrawn` and the
        reason. Only data stewards may withdraw, not supplying systems. `latest` and
        new calculations skip the version; dependent result versions are flagged
        with `based_on_withdrawn`. Sends `dataset.version.withdrawn`.
      x-govstack-requirement: MUST
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: Version withdrawn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetVersion' }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /datasets/{dataset_id}/versions/{version}/export:
    parameters:
      - $ref: '#/components/parameters/DatasetId'
      - $ref: '#/components/parameters/Version'
      - name: format
        in: query
        required: false
        schema: { type: string, enum: [csv], default: csv }
    get:
      tags: [Export]
      operationId: exportDatasetVersion
      summary: Export a dataset version as CSV
      x-govstack-requirement: MUST
      responses:
        '200':
          description: Version content, CSV per RFC 4180 in UTF-8
          headers:
            Content-Disposition:
              description: File name per RFC 6266
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
        '202': { $ref: '#/components/responses/AsyncDownload' }
        '403': { $ref: '#/components/responses/Problem' }
        '410':
          description: Content deleted or version withdrawn; metadata remain available
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /receipts/{receipt_id}:
    parameters:
      - name: receipt_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Ingestion]
      operationId: getReceipt
      summary: Get the validation result of a delivery
      x-govstack-requirement: MUST
      responses:
        '200':
          description: Receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /codelists/{codelist_id}/{schema_version}:
    parameters:
      - name: codelist_id
        in: path
        required: true
        description: Identifier `<dataset_id>.<field>`
        schema: { type: string, pattern: '^[a-z0-9_]+\.[A-Za-z0-9_]+$' }
      - name: schema_version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Catalogue]
      operationId: getCodelist
      summary: Get a code list as a JSON-stat dimension response
      description: Generated from the field's `categories` property in the Table Schema.
      x-govstack-requirement: MUST
      responses:
        '200':
          description: JSON-stat 2.0, class dimension
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonStatDimension' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /indicators:
    post:
      tags: [Indicators]
      operationId: createIndicator
      summary: Create an indicator
      x-govstack-requirement: MUST
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IndicatorCreate' }
      responses:
        '201':
          description: Indicator created
          headers:
            Location: { $ref: '#/components/headers/Location' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /indicators/{indicator_id}/versions:
    parameters:
      - $ref: '#/components/parameters/IndicatorId'
    post:
      tags: [Indicators]
      operationId: createDefinitionVersion
      summary: Create and publish a definition version
      description: |
        The version is immutable afterwards; the building block sends
        `indicator.definition.published`. Input datasets and dimensions are
        derived from the calculation. Definitions in languages the building block
        cannot execute are rejected.
      x-govstack-requirement: MUST
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DefinitionVersionCreate' }
      responses:
        '201':
          description: Version created and published
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefinitionVersion' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /indicators/{indicator_id}/calculations:
    parameters:
      - $ref: '#/components/parameters/IndicatorId'
    post:
      tags: [Indicators]
      operationId: startCalculation
      summary: Start a calculation
      description: |
        Asynchronous. The calculation identifier is also the identifier of the
        result version and of the provenance record. Completion is signalled by
        `indicator.values.published`, failure by `indicator.calculation.failed`.
      x-govstack-requirement: MUST
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition_version]
              properties:
                definition_version: { type: string }
      responses:
        '202':
          description: Calculation accepted
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calculation' }
        default: { $ref: '#/components/responses/Problem' }

  /calculations/{calculation_id}:
    parameters:
      - $ref: '#/components/parameters/CalculationId'
    get:
      tags: [Indicators]
      operationId: getCalculation
      summary: Get the status of a calculation
      x-govstack-requirement: MUST
      responses:
        '200':
          description: Calculation status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calculation' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /lineage/{calculation_id}:
    parameters:
      - $ref: '#/components/parameters/CalculationId'
    get:
      tags: [Provenance]
      operationId: getLineage
      summary: Get a provenance record
      description: Remains available even after the underlying data has been deleted or withdrawn.
      x-govstack-requirement: MUST
      responses:
        '200':
          description: Provenance record per W3C PROV-O as JSON-LD
          content:
            application/ld+json:
              schema: { $ref: '#/components/schemas/ProvActivity' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /indicators/{indicator_id}/values:
    parameters:
      - $ref: '#/components/parameters/IndicatorId'
    get:
      tags: [Values]
      operationId: getValues
      summary: Get indicator values
      description: |
        Without filters, the request returns all values of the current result
        version the caller is authorized for (mandatory). Filters per SDMX REST
        API v2 are recommended. Unknown or unsupported parameters are rejected
        with 400.
      x-govstack-requirement: MUST
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [jsonstat, csv], default: jsonstat }
          x-govstack-requirement: MUST
        - name: result_version
          in: query
          description: Result version (calculation identifier); the current one if omitted
          schema: { type: string }
          x-govstack-requirement: MUST
        - name: c
          in: query
          description: |
            Filter per dimension following SDMX REST API v2, e.g.
            `c[region]=R01,R02` or `c[time_period]=ge:2023`.
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties: { type: string }
          x-govstack-requirement: SHOULD
        - name: updatedAfter
          in: query
          description: Only values changed since this point in time (RFC 3339)
          schema: { type: string, format: date-time }
          x-govstack-requirement: SHOULD
      responses:
        '200':
          description: Values as JSON-stat 2.0 or CSV
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonStatDataset' }
            text/csv:
              schema:
                type: string
                description: |
                  Long format, columns: indicator_id, definition_version,
                  result_version, <dimensions…>, time_period, value,
                  observation_status, unit_multiplier, based_on_withdrawn
        '202': { $ref: '#/components/responses/AsyncDownload' }
        '400': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /downloads/{download_id}:
    parameters:
      - name: download_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Export]
      operationId: getDownload
      summary: Fetch an asynchronous result
      x-govstack-requirement: SHOULD
      responses:
        '200':
          description: Result file
          headers:
            Repr-Digest:
              description: SHA-256 checksum (recommended)
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonStatDataset' }
            text/csv:
              schema: { type: string }
        '202':
          description: Not ready yet
          headers:
            Retry-After:
              schema: { type: integer }
        default: { $ref: '#/components/responses/Problem' }

  /subscriptions:
    post:
      tags: [Events]
      operationId: createSubscription
      summary: Subscribe to events
      description: Field names follow the CloudEvents Subscriptions API (working draft).
      x-govstack-requirement: MUST
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionCreate' }
      responses:
        '201':
          description: Subscription created; identifier assigned by the building block
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        default: { $ref: '#/components/responses/Problem' }

  /subscriptions/{subscription_id}:
    parameters:
      - name: subscription_id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Events]
      operationId: deleteSubscription
      summary: End a subscription
      x-govstack-requirement: MUST
      responses:
        '204':
          description: Subscription ended
        default: { $ref: '#/components/responses/Problem' }

webhooks:
  datasetVersionPublished:
    post:
      summary: dataset.version.published
      x-govstack-requirement: MUST
      requestBody:
        content:
          application/cloudevents+json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CloudEvent'
                - properties:
                    type: { const: org.govstack.analytics.dataset.version.published }
                    data:
                      type: object
                      required: [dataset_id, version, schema_version, checksum]
                      properties:
                        dataset_id: { type: string }
                        version: { type: integer }
                        schema_version: { type: integer }
                        checksum: { type: string }
      responses:
        '2XX': { description: Receipt acknowledged }
  datasetVersionWithdrawn:
    post:
      summary: dataset.version.withdrawn
      x-govstack-requirement: MUST
      requestBody:
        content:
          application/cloudevents+json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CloudEvent'
                - properties:
                    type: { const: org.govstack.analytics.dataset.version.withdrawn }
                    data:
                      type: object
                      required: [dataset_id, version, reason]
                      properties:
                        dataset_id: { type: string }
                        version: { type: integer }
                        reason: { type: string }
      responses:
        '2XX': { description: Receipt acknowledged }
  indicatorDefinitionPublished:
    post:
      summary: indicator.definition.published
      x-govstack-requirement: MUST
      requestBody:
        content:
          application/cloudevents+json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CloudEvent'
                - properties:
                    type: { const: org.govstack.analytics.indicator.definition.published }
                    data:
                      type: object
                      required: [indicator_id, definition_version]
                      properties:
                        indicator_id: { type: string }
                        definition_version: { type: string }
      responses:
        '2XX': { description: Receipt acknowledged }
  indicatorValuesPublished:
    post:
      summary: indicator.values.published
      x-govstack-requirement: MUST
      requestBody:
        content:
          application/cloudevents+json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CloudEvent'
                - properties:
                    type: { const: org.govstack.analytics.indicator.values.published }
                    data:
                      type: object
                      required: [indicator_id, definition_version, result_version]
                      properties:
                        indicator_id: { type: string }
                        definition_version: { type: string }
                        result_version: { type: string }
      responses:
        '2XX': { description: Receipt acknowledged }
  indicatorCalculationFailed:
    post:
      summary: indicator.calculation.failed
      x-govstack-requirement: MUST
      requestBody:
        content:
          application/cloudevents+json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CloudEvent'
                - properties:
                    type: { const: org.govstack.analytics.indicator.calculation.failed }
                    data:
                      type: object
                      required: [indicator_id, definition_version, calculation_id]
                      properties:
                        indicator_id: { type: string }
                        definition_version: { type: string }
                        calculation_id: { type: string }
      responses:
        '2XX': { description: Receipt acknowledged }
  deliveryChecked:
    post:
      summary: delivery.checked
      description: Always sent to the supplying system, regardless of its read permissions.
      x-govstack-requirement: SHOULD
      requestBody:
        content:
          application/cloudevents+json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CloudEvent'
                - properties:
                    type: { const: org.govstack.analytics.delivery.checked }
                    data: { $ref: '#/components/schemas/Receipt' }
      responses:
        '2XX': { description: Receipt acknowledged }
  datasetVersionContentRemoved:
    post:
      summary: dataset.version.content_removed
      x-govstack-requirement: SHOULD
      requestBody:
        content:
          application/cloudevents+json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CloudEvent'
                - properties:
                    type: { const: org.govstack.analytics.dataset.version.content_removed }
                    data:
                      type: object
                      required: [dataset_id, version]
                      properties:
                        dataset_id: { type: string }
                        version: { type: integer }
      responses:
        '2XX': { description: Receipt acknowledged }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token per RFC 6750, issued via the Identity Building Block

  headers:
    Location:
      description: Location of the created or pollable resource
      schema: { type: string, format: uri-reference }

  parameters:
    DatasetId:
      name: dataset_id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9_]+$' }
    IndicatorId:
      name: indicator_id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9_]+$' }
    CalculationId:
      name: calculation_id
      in: path
      required: true
      description: Also the identifier of the result version and of the provenance record
      schema: { type: string }
    Version:
      name: version
      in: path
      required: true
      description: Sequential version number starting at 1, or `latest` (newest valid version)
      schema: { type: string, pattern: '^([1-9][0-9]*|latest)$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Per the IETF HTTPAPI working group draft
      schema: { type: string, minLength: 1 }

  responses:
    Problem:
      description: Error per RFC 9457
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AsyncDownload:
      description: |
        Result larger than the threshold stated in the catalogue; fetch via
        GET /downloads/{download_id}
      headers:
        Location: { $ref: '#/components/headers/Location' }

  schemas:

    Problem:
      type: object
      description: RFC 9457 Problem Details
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        errors:
          type: array
          description: Individual errors, e.g. row and field from schema validation
          items:
            type: object
            properties:
              row: { type: integer }
              field: { type: string }
              detail: { type: string }

    JsonLdContext:
      description: Reference to the spec's context document (DCAT 3, DCTERMS, PROV-O)
      type: string
      format: uri

    Catalogue:
      type: object
      required: [datasets, indicators, calculation_languages]
      properties:
        '@context': { $ref: '#/components/schemas/JsonLdContext' }
        datasets:
          type: array
          items: { $ref: '#/components/schemas/DatasetEntry' }
        indicators:
          type: array
          items: { $ref: '#/components/schemas/IndicatorEntry' }
        calculation_languages:
          type: array
          description: Executable calculation languages, e.g. vtl-2.1, ossie-<version>, x-…
          items: { type: string }
        async_download_threshold_bytes:
          type: integer
          description: Mandatory if the building block offers asynchronous downloads

    DatasetCreate:
      type: object
      required: [dataset_id, title]
      properties:
        dataset_id: { type: string, pattern: '^[a-z0-9_]+$' }
        title: { type: string }
        publisher: { type: string }
        processing_stage:
          type: string
          description: From a code list of the installation

    DatasetEntry:
      type: object
      required: [dataset_id, title, origin, versions]
      properties:
        '@context': { $ref: '#/components/schemas/JsonLdContext' }
        dataset_id: { type: string }
        title: { type: string }
        publisher: { type: string }
        origin: { type: string, enum: [ORIGINAL, DERIVED] }
        processing_stage: { type: string }
        schema:
          type: object
          properties:
            schema_version: { type: integer }
            href: { type: string, format: uri-reference }
        latest_version:
          type: object
          properties:
            version: { type: integer }
            received_at: { type: string, format: date-time }
            href: { type: string, format: uri-reference }
        versions: { type: string, format: uri-reference }
        indicators:
          type: array
          items: { type: string, format: uri-reference }

    DatasetVersion:
      type: object
      required: [dataset_id, version, schema_version, receipt_id, supplied_by, received_at, checksum, status]
      properties:
        dataset_id: { type: string }
        version: { type: integer, minimum: 1 }
        schema_version: { type: integer }
        receipt_id:
          type: string
          description: Receipt of the delivery that created this version
        received_at: { type: string, format: date-time }
        checksum:
          type: string
          description: SHA-256, e.g. sha256:9f2c…
        supplied_by:
          type: string
          description: Supplying system (prov:wasAttributedTo)
        status: { type: string, enum: [valid, withdrawn] }
        content_available: { type: boolean }
        reason: { type: string }
        withdrawn_at: { type: string, format: date-time }
        href: { type: string, format: uri-reference }

    Receipt:
      type: object
      required: [receipt_id, dataset_id, status]
      properties:
        receipt_id: { type: string }
        dataset_id: { type: string }
        status: { type: string, enum: [validating, accepted, rejected] }
        version: { type: integer, description: Only when accepted }
        checksum: { type: string }
        received_at: { type: string, format: date-time }
        href: { type: string, format: uri-reference }
        errors:
          type: array
          description: Only when rejected
          items: { $ref: '#/components/schemas/Problem' }

    DataPackage:
      type: object
      description: Data Package Standard 2.0 (datapackage.org)
      required: [$schema, resources]
      properties:
        $schema: { type: string, const: 'https://datapackage.org/profiles/2.0/datapackage.json' }
        name: { type: string }
        resources:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, path]
            properties:
              name: { type: string }
              path: { type: string }
              type: { type: string, const: table }
              format: { type: string }
              encoding: { type: string, const: utf-8 }
              dialect:
                type: object
                description: Table Dialect, e.g. delimiter
      additionalProperties: true

    TableSchema:
      type: object
      description: Table Schema per Data Package Standard 2.0
      required: [$schema, fields]
      properties:
        $schema: { type: string, const: 'https://datapackage.org/profiles/2.0/tableschema.json' }
        fields:
          type: array
          items:
            type: object
            required: [name, type]
            properties:
              name: { type: string }
              type: { type: string }
              role:
                type: string
                enum: [identifier, time, measure, attribute]
                description: Extension defined by this spec; admissibility in the standard still to be verified
              categories:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: object
                      required: [value]
                      properties:
                        value: { type: string }
                        label: { type: string }
            additionalProperties: true
        primaryKey:
          type: array
          items: { type: string }
      additionalProperties: true

    IndicatorCreate:
      type: object
      required: [indicator_id, title]
      properties:
        indicator_id: { type: string, pattern: '^[a-z0-9_]+$' }
        title: { type: string }

    IndicatorEntry:
      type: object
      properties:
        indicator_id: { type: string }
        title: { type: string }
        unit: { type: string }
        latest_definition_version: { type: string }
        frequency: { type: string }
        input_datasets:
          type: array
          items: { type: string }
        dimensions:
          type: array
          items: { type: string }

    DefinitionVersionCreate:
      type: object
      required: [definition_version, unit, calculation]
      description: |
        A change of formula, unit, scope or dimensions requires a new definition
        version.
      properties:
        definition_version: { type: string }
        unit:
          type: string
          description: UCUM code, e.g. %
        frequency:
          type: string
          description: Optional; code from SDMX CL_FREQ. Derived from the time format if omitted
        geo_dimension:
          type: string
          description: Optional; the dimension that is geographic (JSON-stat role geo)
        codelists:
          type: object
          description: |
            Optional; reference to a shared code list per dimension. By default the
            code lists come from the Table Schemas of the input datasets.
          additionalProperties: { type: string, format: uri-reference }
        calculation:
          type: object
          required: [language, expression]
          properties:
            language:
              type: string
              description: vtl-2.1, ossie-<version> or a custom language with prefix x-
            expression: { type: string }
        dimensions:
          type: array
          description: Only needed if the language does not define the breakdown (e.g. Ossie)
          items: { type: string }

    DefinitionVersion:
      allOf:
        - $ref: '#/components/schemas/DefinitionVersionCreate'
        - type: object
          properties:
            indicator_id: { type: string }
            status: { type: string, enum: [published] }
            input_datasets:
              type: array
              items: { type: string }
            dimensions:
              type: array
              items: { type: string }

    Calculation:
      type: object
      required: [calculation_id, indicator_id, definition_version, status]
      properties:
        calculation_id:
          type: string
          description: Also the identifier of the result version and of the provenance record
        indicator_id: { type: string }
        definition_version: { type: string }
        status: { type: string, enum: [running, succeeded, failed] }
        finished_at: { type: string, format: date-time }
        error: { $ref: '#/components/schemas/Problem' }

    ProvActivity:
      type: object
      description: W3C PROV-O, serialized as JSON-LD 1.1
      required: ['@id', '@type', 'prov:used', 'prov:generated']
      properties:
        '@context': {}
        '@id': { type: string, description: 'urn:analytics:calculation:<calculation_id>' }
        '@type': { const: 'prov:Activity' }
        'prov:used':
          type: array
          description: Input dataset versions
          items:
            type: object
            required: ['@id', checksum]
            properties:
              '@id': { type: string, description: 'Dataset version, <dataset_id>:<version>' }
              checksum: { type: string, description: 'SHA-256 checksum, sha256:<hex>' }
              'prov:wasAttributedTo': { type: string, description: Supplying system }
              'dct:issued': { type: string, format: date-time }
        'prov:qualifiedAssociation':
          type: object
          properties:
            'prov:hadPlan':
              type: object
              properties:
                '@id': { type: string }
        'prov:generated':
          type: object
          properties:
            '@id': { type: string }
        'prov:endedAtTime': { type: string, format: date-time }

    JsonStatDimension:
      type: object
      description: JSON-stat 2.0, class dimension
      required: [version, class, category]
      properties:
        version: { const: '2.0' }
        class: { const: dimension }
        href: { type: string, format: uri }
        label: { type: string }
        category:
          type: object
          properties:
            index:
              type: array
              items: { type: string }
            label:
              type: object
              additionalProperties: { type: string }

    JsonStatDataset:
      type: object
      description: |
        JSON-stat 2.0, class dataset. Observation status and unit multiplier from
        the SDMX code lists CL_OBS_STATUS and CL_UNIT_MULT; time periods in the
        SDMX time format.
      required: [version, class, id, size, dimension, value]
      properties:
        version: { const: '2.0' }
        class: { const: dataset }
        label: { type: string }
        id:
          type: array
          items: { type: string }
        size:
          type: array
          items: { type: integer }
        role: { type: object }
        updated: { type: string, format: date-time }
        dimension: { type: object }
        value:
          type: array
          items: { type: [number, 'null'] }
        status:
          description: |
            Observation status from SDMX CL_OBS_STATUS: a single code for all values,
            an array with one code per value, or an object by position. A value
            without an entry has the status A (normal value).
          oneOf:
            - type: string
            - type: array
              items: { type: [string, 'null'] }
            - type: object
              additionalProperties: { type: string }
        extension:
          type: object
          required: [indicator_id, definition_version, result_version, unit]
          properties:
            indicator_id: { type: string }
            definition_version: { type: string }
            result_version: { type: string }
            unit: { type: string }
            based_on_withdrawn: { type: boolean }

    SubscriptionCreate:
      type: object
      required: [types, sink, protocol]
      properties:
        types:
          type: array
          items: { type: string }
        sink: { type: string, format: uri }
        protocol: { type: string, const: HTTP }

    Subscription:
      allOf:
        - $ref: '#/components/schemas/SubscriptionCreate'
        - type: object
          required: [id]
          properties:
            id: { type: string }

    CloudEvent:
      type: object
      description: CloudEvents 1.0, structured mode in JSON format
      required: [specversion, id, source, type, time, subject, data]
      properties:
        specversion: { const: '1.0' }
        id: { type: string }
        source: { type: string, format: uri-reference }
        type: { type: string }
        time: { type: string, format: date-time }
        subject: { type: string }
        datacontenttype: { type: string, const: application/json }
        data: { type: object }
